<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090707">
  <title>JP BURGUER | Cardápio</title>
  <meta name="description" content="Conheça o cardápio do JP BURGUER.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>
<body>
  <section class="landing-screen" id="landingScreen" aria-label="JP Burguer">
    <div class="landing-shade"></div>
    <div class="landing-content">
      <img class="landing-logo" src="./assets/images/JP.png" alt="JP House Burguer & Beer">
    </div>
    <button class="landing-menu-button" id="enterMenu" type="button">MENU</button>
  </section>

  <main class="app-shell menu-app" id="menuApp" hidden>
    <header class="topbar">
      <a class="brand menu-brand-logo" href="#cardapio" aria-label="JP Burguer"><img src="./assets/images/JP.png" alt="JP House Burguer & Beer"></a>
    </header>
    <section class="menu-section" id="cardapio">
      <div class="section-title">
        <div><span class="section-kicker">JP HOUSE BURGUER & BEER</span><h2>Nosso cardápio<span>.</span></h2></div>
      </div>
      <nav class="category-list" id="categories" aria-label="Categorias do cardápio">
        <button class="category active" data-category="todos">TODOS</button>
      </nav>
      <div class="product-grid" id="productGrid"><p class="menu-loading">CARREGANDO CARDÁPIO...</p></div>
    </section>
    <a class="admin-access" href="./admin.html" aria-label="Acessar painel administrativo" title="Painel administrativo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 14 5l2.5-.2.9 2.3 2.2 1.2-.5 2.5 1 2.3-1.8 1.8-.2 2.5-2.4.7-1.5 2-2.4-.8-2.4.8-1.5-2-2.4-.7-.2-2.5-1.8-1.8 1-2.3-.5-2.5 2.2-1.2.9-2.3L10 5z"/><circle cx="12" cy="12" r="3"/></svg>
    </a>
</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
