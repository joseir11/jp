<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090707">
  <title>JP BURGUER | Cardápio</title>
  <meta name="description" content="Escolha seu burger favorito e faça seu pedido no JP BURGUER.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>
<body>
  <section class="landing-screen" id="landingScreen" aria-label="JP Burguer">
    <div class="landing-shade"></div>
    <div class="landing-content">
      <img class="landing-logo" src="./assets/images/JP.png" alt="JP House Burguer & Beer">
    </div>
    <button class="landing-menu-button" id="enterMenu" type="button">MENU <span>↗</span></button>
  </section>
  <main class="app-shell menu-app" id="menuApp" hidden>
    <header class="topbar">
      <a class="brand" href="#topo" aria-label="JP Burguer início"><span class="brand-mark">JP<span>.</span></span><span class="brand-name">BURGUER</span></a>
      
    </header>
    <section class="menu-section" id="cardapio">
      <div class="section-title"><div><span class="section-kicker">ESCOLHA E APROVEITE</span><h2>Nosso cardápio<span>.</span></h2></div></div>
      <nav class="category-list" id="categories" aria-label="Categorias do cardápio"><button class="category active" data-category="todos">Todos</button></nav>
      <div class="product-grid" id="productGrid"><p class="menu-loading">Carregando nosso cardápio...</p></div>
    </section>
    <footer class="app-footer"><span class="footer-logo">JP<span>.</span></span><span>Obrigado por escolher o JP BURGUER.</span></footer>
  </main>
<button class="floating-cart" id="floatingCart" type="button" aria-label="Ver meu pedido" hidden><span class="floating-cart-icon"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M4.5 14.2C5.2 8.8 9.8 5 16 5s10.8 3.8 11.5 9.2H4.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m10 9.1.8.2m5-1.2.8.2m4.4 1.8.8.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m4.8 15.2 3 1.5 2.5-1.3 3 1.3 2.7-1.3 2.8 1.3 2.7-1.3 2.5 1.3 3-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.2 18h21.6v4.1c0 1.1-.9 2-2 2H7.2c-1.1 0-2-.9-2-2V18Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 26h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="floating-cart-label">Ver meu pedido <small id="floatingCartCount">0 itens</small></span><strong id="floatingCartTotal">R$ 0,00</strong><span class="floating-cart-arrow">→</span></button>
<div class="cart-footer"><div class="cart-total"><span>Total do pedido</span><strong id="cartTotal">R$ 0,00</strong></div><button class="checkout-button" id="checkoutButton" disabled>CONTINUAR <span>→</span></button></div>
  </aside>
</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabase.js"></script>
  <script src="./assets/js/menu.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
